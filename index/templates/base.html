<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sari-Sari Store System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 1rem 2rem; text-align: center; }
        nav { background-color: #34495e; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .nav-center { display: flex; justify-content: center; }
        nav a { color: white; text-decoration: none; padding: 14px 20px; transition: background 0.3s; display: inline-block; }
        nav a:hover, nav a.active { background-color: #1abc9c; }
        .container { width: 100% !important; max-width: 100% !important; padding: 20px; box-sizing: border-box; margin: 0; }
        body { adding: 0; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th:last-child, td:last-child { text-align: center; vertical-align: middle; }
        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .form-actions { margin-top: 15px; text-align: left; }
        .cart-action-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .action-cart-form { display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: center !important; gap: 8px !important; }
        .qty-input { width: 55px !important; padding: 6px !important; text-align: center !important; box-sizing: border-box !important; }
        th { background-color: #f8f9fa; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; text-decoration: none; font-size: 14px; }
        .btn-blue { background-color: #3498db; color: white !important; padding: 6px 12px; border-radius: 4px; text-decoration: none; }
        .btn-red { background-color: #e74c3c; color: white !important; padding: 6px 12px; border-radius: 4px; text-decoration: none; }
        .btn-green { background-color: #2ecc71 !important; color: white !important; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-green:hover { background-color: #27ae60 !important; }
        .btn-red { background-color: #c0392b; }
        .btn-red:hover { background-color: #e74c3c; }
        .btn-logout { background-color: #c0392b; border-radius: 4px; margin: 5px 0; padding: 8px 15px !important; /* Makes it look like a button */ }
        .btn-logout:hover { background-color: #e74c3c !important; }
        .form-group { display: inline-block; margin-right: 15px; }
        input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .flash-messages { color: #d35400; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr !important; }
        nav { flex-direction: column !important; gap: 10px; padding: 10px !important; }
}
    </style>
</head>
<body>
    <header>
        <h1>Sari-Sari Store System</h1>
    </header>
    <nav>
       <div style="flex: 1;"></div>

    <div class="nav-center">
        <a href="{{ url_for('products') }}" class="{% if active_tab == 'products' %}active{% endif %}">Manage Products</a>
        <a href="{{ url_for('sales') }}" class="{% if active_tab == 'sales' %}active{% endif %}">Process Sale</a>
        <a href="{{ url_for('reports') }}" class="{% if active_tab == 'reports' %}active{% endif %}">Sales Report</a>
    </div>

    <div style="flex: 1; display: flex; justify-content: flex-end;">
        <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
    </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">
              {% for message in messages %}{{ message }}<br>{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
