{% extends 'base.html' %}
{% block content %}
<h2>Manage Products</h2>

<div style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
    <form action="{{ url_for('add_product') }}" method="POST">
        <div class="form-group">
            <label>Name:</label><br>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Price (₱):</label><br>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div class="form-group">
            <label>Stock:</label><br>
            <input type="number" name="stock" required>
        </div>
        <button type="submit" class="btn btn-green">Add Product</button>
    </form>
</div>

<div style="margin-bottom: 20px;">
    <form action="{{ url_for('products') }}" method="GET" style="display: flex; gap: 8px;">
        <input type="text" name="search" placeholder="Search product name..." value="{{ search_query }}" style="flex: 1; padding: 10px;">
        <button type="submit" class="btn" style="background-color: #34495e; color: white; padding: 10px 20px;">Search</button>
        {% if search_query %}
            <a href="{{ url_for('products') }}" class="btn btn-red" style="padding: 10px 15px; text-decoration: none;">Clear</a>
        {% endif %}
    </form>
</div>

<div class="table-responsive">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>₱{{ "%.2f"|format(product.price) }}</td>
                <td>{{ product.stock }}</td>
                <td>
                    <div class="action-buttons">
                        <a href="{{ url_for('edit_product', id=product.id) }}" class="btn btn-blue">Edit</a>
                        <a href="{{ url_for('delete_product', id=product.id) }}" class="btn btn-red" onclick="return confirm('Delete this product?')">Delete</a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
