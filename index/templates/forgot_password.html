<!DOCTYPE html>
<html>
<head>
    <title>Forgotten Password | Sari-Sari App</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 400px; }
        h2 { margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dddfe2; border-radius: 5px; box-sizing: border-box; }
        .btn-reset { background-color: #1877f2; color: white; border: none; width: 100%; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .footer-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { background-color: #e4e6eb; color: #4b4f56; text-decoration: none; padding: 10px; border-radius: 6px; text-align: center; flex: 1; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Find Your Account</h2>
        <hr>
        {% with messages = get_flashed_messages() %}{% if messages %}
            {% for m in messages %}<p style="color:red; font-size:13px;">{{m}}</p>{% endfor %}
        {% endif %}{% endwith %}
        <form method="POST">
            <p>Enter your username and recovery answer to reset your password.</p>
            <input type="text" name="username" placeholder="Username" required>
            <input type="text" name="recovery_answer" placeholder="Your favorite food?" required>
            <input type="password" name="new_password" placeholder="Enter new password" required>
            <div class="footer-btns">
                <a href="{{ url_for('login') }}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-reset" style="flex: 2;">Reset Password</button>
            </div>
        </form>
    </div>
</body>
</html>
